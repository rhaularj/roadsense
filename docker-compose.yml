# docker compose up --build   → web app http://localhost:7860 (sign in; the first admin password is in the
#                                data volume at initial_admin_password.txt unless ROADSENSE_ADMIN_PASSWORD is set)
# Put yolov8m_rdd2022.pt and rtdetr_l_rdd2022.pt in ./weights first.
#
# Only the web app is published. The agent API and the mock 311 server are bound to localhost: put a TLS reverse
# proxy in front and expose exactly two things to the internet: the web app, and GET /media/* of the agent API
# (signed evidence links the road authority opens). See docs/deployment.md.
services:
  roadsense:
    build: .
    env_file: .env
    environment:
      ROADSENSE_WEIGHTS_DIR: /app/weights
      ROADSENSE_DATA_DIR: /app/data
      ROADSENSE_DEVICE: cpu
    ports:
      - "7860:7860"
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8311:8311"
    volumes:
      - ./weights:/app/weights:ro
      - roadsense-data:/app/data
    restart: unless-stopped
volumes:
  roadsense-data:
