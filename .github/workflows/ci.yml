name: CI

on:
  push:
    branches: [Dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install (CPU torch, then pinned requirements)
        run: |
          pip install torch==2.14.1 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.lock
      - name: Lint
        run: ruff check roadsense scripts tests
      - name: Front-end syntax
        run: node --check roadsense/web/static/app.js
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.lock --progress-spinner off || true

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t roadsense:ci .
